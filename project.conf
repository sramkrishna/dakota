name: bluefin

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  # FIXME: figure out why this does not work
  # - gnome-build-meta.bst:include/aliases.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64
  # Default to false since we would have to disable
  # it for every invocation on aarch64 and it would
  # be annoying
  x86_64_v3:
    type: bool
    description: Enable x86_64-v3
    default: false
  # Gaming variant: adds the gaming/ userspace stack and selects the OGC
  # kernel. Non-gaming variants use the freedesktop-sdk stable kernel.
  # Enable with `-o gaming true` (Justfile: BUILD_GAMING=true).
  gaming:
    type: bool
    description: Build the gaming variant (gaming userspace stack)
    default: false

sandbox:
  build-arch: "%{arch}"

variables:
  branch: main
  # One branch per value of the `arch` option above, and every branch defines
  # the same variable names.
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
    - arch == "aarch64":
        go-arch: "arm64"

# Project name

# The uri to download built artifacts from for this project
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  # The Chunkah ownership companion records public staging results while preserving
  # BuildStream compose filtering and integration semantics.
  - origin: local
    path: plugins
    elements:
      - chunkah-ownership

  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch
      - docker
      - git

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - gen_cargo_lock
      - cargo2
      - git_module
      - git_repo
      - go_module
      - patch_queue
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe

environment:
  # Python packages whose build-time version detection via setuptools-scm /
  # hatch-vcs / vcs-versioning fails in the bst sandbox because git-describe
  # is pathologically slow against the shallow-staged repo. Hardcode the
  # version each fdsdk element pins so the broken codepath is skipped.
  #
  # To add a new one: grep fdsdk element for the ref: line, trim to
  # "X.Y.Z", add SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<UPPER_NAME>: "X.Y.Z"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SETUPTOOLS_SCM: "10.2.3"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VCS_VERSIONING: "2.3.4"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ATTRS: "26.1.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HATCH_VCS: "0.5.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HATCH_FANCY_PYPI_README: "25.1.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DULWICH: "1.2.14"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PKCS11: "0.9.5"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PLUGGY: "1.6.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CHARSET_NORMALIZER: "3.5.1"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SETUPTOOLS_RUST: "1.13.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TPM2_PYTSS: "3.0.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_UJSON: "5.13.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_BACKPORTS_ENTRYPOINTS_SELECTABLE: "1.3.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_URLLIB3: "2.7.0"
  VCS_VERSIONING_PRETEND_VERSION_FOR_SETUPTOOLS_SCM: "10.2.3"
